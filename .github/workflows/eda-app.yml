# .github/workflows/eda-app.yml
# Runs your Telco churn EDA script on every push/PR to main, and allows manual runs.

name: Telco Churn EDA Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-eda:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install project deps
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # CI tooling
          pip install flake8

      - name: Lint (critical errors only)
        run: |
          # Fail the build only on syntax errors / undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify dataset exists (repo root)
        run: |
          ls -la
          test -f "WA_Fn-UseC_-Telco-Customer-Churn.csv"

      - name: Run EDA script
        env:
          # Non-interactive backend so matplotlib doesn't require a display
          MPLBACKEND: Agg
        run: |
          python eda_storyboard.py

      - name: Upload generated images (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eda-outputs
          path: |
            visuals/**
            *.png
            *.jpg
            *.jpeg
          if-no-files-found: ignore
